services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${HMS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${HMS_POSTGRES_PASSWORD:?Set HMS_POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: hms_identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${HMS_POSTGRES_PASSWORD:?Set HMS_POSTGRES_PASSWORD in deploy/.env}
    depends_on:
      - postgres
    volumes:
      - ./postgres/init:/seed:ro
    command: >
      sh -c "until pg_isready -h postgres -U ${HMS_POSTGRES_USER:-postgres}; do sleep 1; done;
      psql -h postgres -U ${HMS_POSTGRES_USER:-postgres} -d hms_identity_db -f /seed/01-hms-seed.sql"

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${HMS_PGADMIN_EMAIL:-admin@hms.dev}
      PGADMIN_DEFAULT_PASSWORD: ${HMS_PGADMIN_PASSWORD:?Set HMS_PGADMIN_PASSWORD in deploy/.env}
    ports:
      - "5050:80"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${HMS_RABBITMQ_USERNAME:?Set HMS_RABBITMQ_USERNAME in deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${HMS_RABBITMQ_PASSWORD:?Set HMS_RABBITMQ_PASSWORD in deploy/.env}
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  identity-api:
    build:
      context: ../backend
      dockerfile: src/Services/Identity/HMS.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=hms_identity_db;Username=${HMS_POSTGRES_USER:-postgres};Password=${HMS_POSTGRES_PASSWORD:?Set HMS_POSTGRES_PASSWORD in deploy/.env}
      Security__Jwt__SigningKey: ${HMS_JWT_SIGNING_KEY:?Set HMS_JWT_SIGNING_KEY in deploy/.env}
      Seed__DefaultPassword: ${HMS_SEED_DEFAULT_PASSWORD:?Set HMS_SEED_DEFAULT_PASSWORD in deploy/.env}
    ports:
      - "5101:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  patients-api:
    build:
      context: ../backend
      dockerfile: src/Services/Patients/HMS.Patients.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PatientManagementDb: Host=postgres;Port=5432;Database=hms_patient_management_db;Username=${HMS_POSTGRES_USER:-postgres};Password=${HMS_POSTGRES_PASSWORD:?Set HMS_POSTGRES_PASSWORD in deploy/.env}
      Security__Jwt__SigningKey: ${HMS_JWT_SIGNING_KEY:?Set HMS_JWT_SIGNING_KEY in deploy/.env}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Username: ${HMS_RABBITMQ_USERNAME:?Set HMS_RABBITMQ_USERNAME in deploy/.env}
      RabbitMq__Password: ${HMS_RABBITMQ_PASSWORD:?Set HMS_RABBITMQ_PASSWORD in deploy/.env}
    ports:
      - "5102:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started

  clinical-api:
    build:
      context: ../backend
      dockerfile: src/Services/Clinical/HMS.Clinical.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ClinicalDb: Host=postgres;Port=5432;Database=hms_clinical_db;Username=${HMS_POSTGRES_USER:-postgres};Password=${HMS_POSTGRES_PASSWORD:?Set HMS_POSTGRES_PASSWORD in deploy/.env}
      Security__Jwt__SigningKey: ${HMS_JWT_SIGNING_KEY:?Set HMS_JWT_SIGNING_KEY in deploy/.env}
    ports:
      - "5104:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  billing-api:
    build:
      context: ../backend
      dockerfile: src/Services/Billing/HMS.Billing.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BillingDb: Host=postgres;Port=5432;Database=hms_billing_db;Username=${HMS_POSTGRES_USER:-postgres};Password=${HMS_POSTGRES_PASSWORD:?Set HMS_POSTGRES_PASSWORD in deploy/.env}
      Security__Jwt__SigningKey: ${HMS_JWT_SIGNING_KEY:?Set HMS_JWT_SIGNING_KEY in deploy/.env}
    ports:
      - "5105:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: ../backend
      dockerfile: src/ApiGateway/HMS.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Security__Jwt__SigningKey: ${HMS_JWT_SIGNING_KEY:?Set HMS_JWT_SIGNING_KEY in deploy/.env}
    ports:
      - "5200:8080"
    depends_on:
      - identity-api
      - patients-api
      - clinical-api
      - billing-api

  hms-web:
    build:
      context: ../frontend/hms-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  pgadmin-data:
