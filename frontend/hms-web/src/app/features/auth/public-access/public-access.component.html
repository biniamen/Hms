  <main class="grid min-h-screen place-items-center bg-slate-100 p-4">
    <form class="enterprise-panel grid w-[min(430px,100%)] gap-4 p-7" *ngIf="vm.setupMode(); else accountAccessView" (ngSubmit)="vm.setupPassword()">
      <span class="grid h-12 w-12 place-items-center rounded-lg bg-mint-500 text-xl font-black text-white">H</span>
      <div><h1 class="text-2xl font-black text-slate-900">Create Password</h1><p class="text-sm text-slate-500">Set a secure password to activate your HMS account.</p></div>
      <label class="field-label">New Password<input class="field-control" name="newPassword" type="password" [(ngModel)]="vm.setupPasswordForm.password" autocomplete="new-password"></label>
      <label class="field-label">Confirm Password<input class="field-control" name="confirmPassword" type="password" [(ngModel)]="vm.setupPasswordForm.confirmPassword" autocomplete="new-password"></label>
      <p class="text-xs font-semibold leading-5 text-slate-500">Use at least 8 characters with uppercase, lowercase, and a number.</p>
      <button class="btn-primary" type="submit" [disabled]="vm.loading()">{{ vm.loading() ? 'Saving...' : 'Save Password' }}</button>
    </form>
    <ng-template #accountAccessView>
    <form class="enterprise-panel grid w-[min(430px,100%)] gap-4 p-7" *ngIf="vm.forgotMode(); else loginView" (ngSubmit)="vm.requestPasswordReset()">
      <span class="grid h-12 w-12 place-items-center rounded-lg bg-mint-500 text-xl font-black text-white">H</span>
      <div><h1 class="text-2xl font-black text-slate-900">Reset Password</h1><p class="text-sm text-slate-500">Enter your account email to receive a secure reset link.</p></div>
      <label class="field-label">Email<input class="field-control" name="forgotEmail" type="email" [(ngModel)]="vm.forgotPasswordForm.emailAddress" autocomplete="username"></label>
      <button class="btn-primary" type="submit" [disabled]="vm.loading()">{{ vm.loading() ? 'Preparing...' : 'Send Reset Link' }}</button>
      <button class="btn-secondary" type="button" (click)="vm.backToLogin()">Back to Sign In</button>
    </form>
    <ng-template #loginView>
    <form class="enterprise-panel grid w-[min(430px,100%)] gap-4 p-7" (ngSubmit)="vm.login()">
      <span class="grid h-12 w-12 place-items-center rounded-lg bg-mint-500 text-xl font-black text-white">H</span>
      <div><h1 class="text-2xl font-black text-slate-900">HMS Platform</h1><p class="text-sm text-slate-500">Sign in to the enterprise hospital workspace.</p></div>
      <label class="field-label">Email<input class="field-control" name="emailAddress" [(ngModel)]="vm.emailAddress" autocomplete="username"></label>
      <label class="field-label">Password
        <span class="grid grid-cols-[1fr_auto] overflow-hidden rounded-lg border border-slate-300 bg-white shadow-sm focus-within:border-brand-500 focus-within:ring-4 focus-within:ring-brand-100">
          <input class="border-0 bg-transparent px-3 py-3 outline-none" name="password" [type]="vm.showLoginPassword() ? 'text' : 'password'" [(ngModel)]="vm.password" autocomplete="current-password">
          <button class="px-3 text-sm font-black text-brand-700" type="button" (click)="vm.showLoginPassword.set(!vm.showLoginPassword())">{{ vm.showLoginPassword() ? 'Hide' : 'Show' }}</button>
        </span>
      </label>
      <button class="btn-primary" type="submit" [disabled]="vm.loading()">{{ vm.loading() ? 'Signing in...' : 'Sign In' }}</button>
      <button class="btn-secondary" type="button" (click)="vm.showForgotPassword()">Forgot Password</button>
    </form>
    </ng-template>
    </ng-template>
  </main>
