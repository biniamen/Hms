<main class="min-h-screen bg-slate-100">
  <div class="grid min-h-screen grid-cols-[280px_minmax(0,1fr)] max-[900px]:grid-cols-1">
    <aside class="bg-brand-900 p-5 text-white">
      <div class="mb-7 flex items-center gap-3">
        <span class="grid h-11 w-11 place-items-center rounded-lg bg-mint-500 text-lg font-black">H</span>
        <div>
          <strong class="block text-lg">HMS Platform</strong>
          <span class="text-xs uppercase text-slate-300">{{ user.role }}</span>
        </div>
      </div>

      <nav class="grid gap-2 max-[900px]:grid-cols-2">
        <button
          *ngFor="let item of vm.nav"
          type="button"
          [hidden]="!vm.canSee(item, user)"
          (click)="vm.load(item.id)"
          class="rounded-lg border border-transparent px-4 py-3 text-left text-sm font-bold text-slate-200 transition hover:border-slate-600 hover:bg-slate-800"
          [class.border-slate-500]="vm.active() === item.id"
          [class.bg-slate-800]="vm.active() === item.id"
        >
          {{ item.label }}
        </button>
      </nav>
    </aside>

    <section class="min-w-0 p-7 max-[700px]:p-4">
      <header class="mb-5 flex items-center justify-between gap-4 max-[700px]:items-start max-[700px]:flex-col">
        <div>
          <p class="text-xs font-extrabold uppercase text-slate-500">Hospital Management System</p>
          <h1 class="text-3xl font-black text-slate-900">{{ vm.activeTitle() }}</h1>
        </div>
        <div class="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-4 py-3 shadow-panel">
          <div class="text-right">
            <strong class="block text-sm text-slate-800">{{ user.emailAddress }}</strong>
            <span class="text-xs font-bold uppercase text-slate-500">{{ user.permission }}</span>
          </div>
          <button class="btn-secondary" type="button" (click)="vm.logout()">Logout</button>
        </div>
      </header>

      <section class="mb-5 grid grid-cols-4 gap-4 max-[1100px]:grid-cols-2 max-[640px]:grid-cols-1">
        <article *ngFor="let stat of vm.stats()" class="enterprise-panel p-5">
          <span class="inline-flex rounded-lg px-3 py-1 text-xs font-black uppercase" [ngClass]="stat.tone">{{ stat.label }}</span>
          <strong class="mt-3 block text-3xl font-black text-slate-900">{{ stat.value }}</strong>
        </article>
      </section>

      <hms-dashboard-page *ngIf="vm.active() === 'dashboard'" [vm]="vm"></hms-dashboard-page>
      <hms-system-health-page *ngIf="vm.active() === 'operations'" [vm]="vm"></hms-system-health-page>
      <hms-access-control-page *ngIf="vm.active() === 'admin'" [vm]="vm"></hms-access-control-page>
      <hms-operations-workbench-page *ngIf="vm.active() === 'enterprise'" [vm]="vm"></hms-operations-workbench-page>

      <section *ngIf="vm.active() !== 'dashboard' && vm.active() !== 'operations' && vm.active() !== 'admin' && vm.active() !== 'enterprise'" class="grid gap-4">
        <div class="enterprise-panel p-4">
          <div class="flex items-center justify-between gap-3 max-[900px]:flex-col max-[900px]:items-stretch">
            <label class="field-label max-w-sm flex-1">Search
              <input class="field-control" [ngModel]="vm.search()" (ngModelChange)="vm.search.set($event)" placeholder="Filter table rows">
            </label>
            <div class="flex flex-wrap gap-2">
              <button class="btn-primary" *ngIf="vm.active() === 'employees'" type="button" (click)="vm.openCreateEmployee()">New Employee</button>
              <button class="btn-primary" *ngIf="vm.active() === 'patients'" type="button" (click)="vm.openCreatePatient()">Register Patient</button>
              <button class="btn-primary" *ngIf="vm.active() === 'insurance'" type="button" (click)="vm.modal.set('insurance')">Register Company</button>
              <button class="btn-primary" *ngIf="vm.active() === 'appointments'" type="button" (click)="vm.openAppointmentModal()">Book Appointment</button>
            </div>
          </div>
        </div>

        <ng-container [ngSwitch]="vm.active()">
          <hms-staff-directory-page *ngSwitchCase="'employees'" [vm]="vm"></hms-staff-directory-page>
          <hms-patients-page *ngSwitchCase="'patients'" [vm]="vm"></hms-patients-page>
          <hms-insurance-page *ngSwitchCase="'insurance'" [vm]="vm"></hms-insurance-page>
          <hms-appointments-page *ngSwitchCase="'appointments'" [vm]="vm"></hms-appointments-page>
          <hms-clinical-page *ngSwitchCase="'clinical'" [vm]="vm"></hms-clinical-page>
          <hms-billing-page *ngSwitchCase="'billing'" [vm]="vm"></hms-billing-page>
        </ng-container>
      </section>
    </section>
  </div>
</main>
